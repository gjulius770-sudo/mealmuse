{% extends "base.html" %}
{% block content %}
    <h1>Your Budget</h1>

    <form method="POST">
        <label>Amount</label>
        <input type="number" name="amount" step="0.01" value="{{ budget.amount if budget else '' }}" required>

        <label>Period</label>
        <select name="period">
            <option value="weekly" {% if budget and budget.period == 'weekly' %}selected{% endif %}>Weekly</option>
            <option value="monthly" {% if budget and budget.period == 'monthly' %}selected{% endif %}>Monthly</option>
        </select>

        <button type="submit">Save</button>
    </form>
{% endblock %}
